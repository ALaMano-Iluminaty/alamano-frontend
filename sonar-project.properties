# HU-Q5: analisis estatico y cobertura del frontend en SonarCloud.
sonar.organization=alamano-iluminaty
# El repo en GitHub se renombro de "Front" a "alamano-frontend", asi que SonarCloud
# genero esta clave al importarlo. No cambiar sin actualizar tambien el proyecto en
# la UI de SonarCloud.
sonar.projectKey=ALaMano-Iluminaty_alamano-frontend
sonar.projectName=alamano-frontend

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/**/*.d.ts
# Capa de presentacion (UI pura): se excluye del PORCENTAJE de cobertura, pero sigue
# analizandose por reglas estaticas (bugs, vulnerabilidades, code smells, hotspots).
# La logica vive en hooks/ y services.ts y ESA si cuenta en la cobertura. Debe
# alinearse con el "exclude" de coverage en vitest.config.ts para no reportar 0 %
# en archivos que no son medibles razonablemente.
sonar.coverage.exclusions=src/main.tsx,src/vite-env.d.ts,src/App.tsx,src/layouts/**,src/components/**,src/lib/map/**,src/lib/mock/**,src/assets/**,src/features/**/components/**,src/features/**/screens/**,src/App.tsx,src/layouts/**,src/components/**,src/lib/map/**,src/lib/mock/**,src/assets/**,src/features/auth/components/GoogleSignInButton.tsx

# Lo genera `vitest run --coverage` (tarea de Vitest y cobertura >= 40 %).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
