# HU-Q5: analisis estatico y cobertura del frontend en SonarCloud.
sonar.organization=alamano-iluminaty
# El repo en GitHub se renombro de "Front" a "alamano-frontend", asi que SonarCloud
# genero esta clave al importarlo. No cambiar sin actualizar tambien el proyecto en
# la UI de SonarCloud.
sonar.projectKey=ALaMano-Iluminaty_alamano-frontend
sonar.projectName=alamano-frontend

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/**/*.d.ts
sonar.coverage.exclusions=src/main.tsx,src/vite-env.d.ts

# Lo genera `vitest run --coverage` (tarea de Vitest y cobertura >= 40 %).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
