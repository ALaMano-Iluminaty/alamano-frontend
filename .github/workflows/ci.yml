name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Lint, tipos, build y SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # SonarCloud necesita el historial para distinguir el codigo nuevo del viejo.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # HU-Q5: Vitest con el proveedor v8 deja coverage/lcov.info, que es lo que lee
      # SonarCloud para el 40 % de cobertura del quality gate.
      - name: Tests con cobertura
        run: npm run test:coverage

      # Sin variables VITE_*: el código usa /api, /auth y /ws (rutas relativas),
      # que son las que sirve nginx en la VM.
      - name: Build
        run: npm run build

      # HU-Q5: espera el Quality Gate y falla si no pasa (cobertura < 40 %, bugs o
      # vulnerabilidades nuevas), asi que con la rama protegida el PR no se puede integrar.
      - name: SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Publicar imagen
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # GHCR solo acepta nombres en minuscula y la organizacion tiene mayusculas.
      - name: Nombre de la imagen en minuscula
        run: echo "IMAGE=ghcr.io/${REPO,,}" >> $GITHUB_ENV
        env:
          REPO: ${{ github.repository }}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          # HU-G2: el Client ID de Google se pasa como build-arg para que Vite
          # lo incruste en el bundle. Se guarda en Repository Variables (no
          # Secrets): es publico y tiene que ser legible al pie del codigo.
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            
  deploy:
    name: Desplegar en la VM
    needs: image
    if: github.event_name == 'push' && vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    # Un deploy a la vez: dos merges seguidos no se pisan.
    concurrency:
      group: deploy-vm
      cancel-in-progress: false
    steps:
      - name: Preparar SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      # La VM ignora el argumento: esta llave solo puede correr deploy.sh.
      - name: Desplegar
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" deploy
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}