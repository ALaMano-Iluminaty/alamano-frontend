name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Lint, tipos y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Sin variables VITE_*: el código usa /api, /auth y /ws (rutas relativas),
      # que son las que sirve nginx en la VM.
      - name: Build
        run: npm run build

  image:
    name: Publicar imagen
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR solo acepta nombres en minuscula y la organizacion tiene mayusculas.
      - name: Nombre de la imagen en minuscula
        run: echo "IMAGE=ghcr.io/${REPO,,}" >> $GITHUB_ENV
        env:
          REPO: ${{ github.repository }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            
  deploy:
    name: Desplegar en la VM
    needs: image
    if: github.event_name == 'push' && vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    # Un deploy a la vez: dos merges seguidos no se pisan.
    concurrency:
      group: deploy-vm
      cancel-in-progress: false
    steps:
      - name: Preparar SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      # La VM ignora el argumento: esta llave solo puede correr deploy.sh.
      - name: Desplegar
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" deploy
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}